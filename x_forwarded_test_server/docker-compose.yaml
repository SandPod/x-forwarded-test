services:
  # Development services
  postgres:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: x_forwarded_test
      POSTGRES_PASSWORD: "TSPidCvRuySyXIkiRkchMIF6O_-zvchI"
    volumes:
      - x_forwarded_test_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "R_4tC3ivIzAv2aLraF2lBOB4gm_RDZr_"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: x_forwarded_test_test
      POSTGRES_PASSWORD: "b24fwwjCiPLlOQyt4PWbufCvZdlOncXn"
    volumes:
      - x_forwarded_test_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "gtdM_KTJFnqtzJYVVIT_wGXABsFac2Xa"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  x_forwarded_test_data:
  x_forwarded_test_test_data:
